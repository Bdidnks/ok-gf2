name: Sync upstream into personal fork

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Bdidnks/ok-gf2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Merge original project into this fork
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/AliceJump/ok-gf2.git
          git fetch --no-tags upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Fork is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff upstream/master || true
          if [ ! -f "$(git rev-parse --git-path MERGE_HEAD)" ]; then
            echo "Upstream merge did not start; fork was left unchanged."
            exit 1
          fi
          # Keep this fork's workflows: GITHUB_TOKEN cannot push upstream workflow edits.
          git restore --source=HEAD --staged --worktree -- .github/workflows
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          if [ "${#conflicts[@]}" -eq 1 ] && [ "${conflicts[0]}" = "assets/downloads.svg" ]; then
            git checkout --theirs -- assets/downloads.svg
            git add assets/downloads.svg
          elif [ "${#conflicts[@]}" -ne 0 ]; then
            git merge --abort || true
            echo "Merge conflict outside generated download statistics; fork was left unchanged."
            exit 1
          fi
          git commit --no-edit
          git push origin HEAD:master
