name: Sync upstream into personal fork

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Bdidnks/ok-gf2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Merge original project into this fork
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/AliceJump/ok-gf2.git
          git fetch --no-tags upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Fork is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-edit upstream/master; then
            git merge --abort || true
            echo "Merge conflict: fork was left unchanged. Resolve it manually."
            exit 1
          fi
          git push origin HEAD:master
